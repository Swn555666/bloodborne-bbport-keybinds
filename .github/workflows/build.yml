name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/BBKeybinds.csproj -c Release

      - name: Self-test
        run: |
          dotnet run --project src/BBKeybinds.csproj -c Release -- --selftest selftest.txt
          Get-Content selftest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
